[build]
builder = "NIXPACKS"
buildCommand = "rm -rf node_modules node_modules/.cache && npm ci --prefer-online --no-audit --no-fund && npm run build && pip install -r requirements.txt"

[deploy]
startCommand = "gunicorn --bind 0.0.0.0:$PORT 'whatsapp_webhook:create_app()'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
