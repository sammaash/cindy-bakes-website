[phases.setup]
nixPkgs = ["nodejs_22", "python312"]

[phases.build]
cmds = [
  "rm -rf node_modules node_modules/.cache",
  "npm ci --prefer-online --no-audit --no-fund",
  "npm run build",
  "pip install -r requirements.txt",
]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT 'whatsapp_webhook:create_app()'"